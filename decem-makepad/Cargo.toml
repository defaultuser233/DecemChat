[package]
name = "decem-makepad"
version = "0.1.0"
edition = "2021"

# 隔离靠根 Cargo.toml 的 `exclude = ["decem-makepad"]`（那条才是真正生效的）。
# **不要在这里写 `[workspace]`**：`cargo makepad android` 会生成一个包装 crate
# 并在它的 manifest 里追加 `[workspace]`，这里再写一份就会 `duplicate key`，
# Android 打包直接失败（2026-10-17 踩过）。
# 没有 `[workspace]` 也会自动拥有独立 Cargo.lock（包在根 workspace 之外时 cargo 的默认行为）。

[dependencies]
decem-core = { version = "0.1.0", path = "../crates/decem-core", default-features = false }
makepad-base64 = { git = "https://github.com/makepad/makepad", branch = "dev", version = "1.0.0" }
makepad-code-editor = { git = "https://github.com/makepad/makepad", branch = "dev", version = "2.0.0" }
# 只开需要的 family：rich_text（含 Markdown）、glass（输入框与按钮的样式）
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev", default-features = false, features = ["rich_text", "glass"] }
serde_json = "1.0.154"

# 与 Makepad 仓库自身的建议一致：release 保持增量、不开 LTO
[profile.release]
incremental = true
lto = false
