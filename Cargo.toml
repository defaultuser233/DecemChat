[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
# Makepad 版是独立 crate（自带 workspace 与几十个 vendored 依赖）：不并进主仓库，
# 免得 cargo clippy --workspace 把它拖进来
exclude = ["decem-makepad"]

[workspace.package]
version = "2.42.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
