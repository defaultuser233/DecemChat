[package]
name = "decem-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
decem-core = { version = "0.1.0", path = "../decem-core" }
directories = "6.0.0"
eframe = "0.36"
egui = "0.36"
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }
egui_extras = { version = "0.36", features = ["image"] }
env_logger = "0.11.11"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jiff = "0.2.37"
log = "0.4.34"
rfd = "0.17.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
