name: Rust 全平台构建

# Rust 版 Decem Chat 的检查与跨平台产物构建。
# 三个平台（Windows / macOS / Linux）× 两种架构（x64 / arm64）各出一份可执行文件。

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: 检查与测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux 上要装两套桌面依赖：egui 要 X11 / Wayland / OpenGL，
      # Tauri（src-tauri）要 WebKitGTK 4.1 以及 appindicator / rsvg / xdo
      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev libgl1-mesa-dev \
            libwayland-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --workspace

      - name: 无界面自检（存储往返与请求编排）
        run: cargo run -q -p decem-app -- --selftest

  build:
    name: 构建 ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # 目标平台不可用时（例如私有仓库拿不到 ubuntu-24.04-arm）应尽快失败，而不是排队挂满 6 小时
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # ARM64 运行器上原生构建，避免交叉编译缺 GTK/OpenGL 开发库
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Apple 工具链自带双架构 SDK，可在 arm64 机器上出 x64 产物
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev libgl1-mesa-dev \
            libwayland-dev libssl-dev pkg-config

      - name: 安装 Rust 工具链与目标平台
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring 在「Windows + aarch64」这个组合下强制改用 clang 编译它的 C 代码
      # （ring-0.17.14/build.rs:563-565），本机没有 clang 就会停在 cc-rs 报错。
      - name: 确保 clang 可用（Windows/arm64 特有前提）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "clang 已就绪：$(clang --version | head -1)"
          else
            choco install llvm -y --no-progress
            echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          fi

      - name: 编译发布版
        run: cargo build --release --target ${{ matrix.target }} -p decem-app

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${{ runner.os }}" in
            Windows) cp "target/${{ matrix.target }}/release/decem-app.exe" artifacts/ ;;
            *)      cp "target/${{ matrix.target }}/release/decem-app" artifacts/ ;;
          esac
          cp README.md artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: decem-app-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  # Android 出包放在 Linux runner 上：那边创建符号链接没有 Windows 那种限制，
  # 也不依赖本机装了 Android Studio。产物是 debug 签名的 APK，可直接侧载。
  android:
    name: 构建 Android APK（debug）
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Tauri 的 Android 模板写死了 NDK 29.0.13846066 与 compileSdk 37
      - name: 安装 NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: true

      # 解压出来的符号链接在某些镜像上会让 clang 找不到自己：把链接展开成实体文件
      - name: 展开 NDK 里的符号链接
        run: |
          set -euo pipefail
          bin="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -d "$bin" ]; then
            for f in "$bin"/*; do
              if [ -L "$f" ]; then
                target=$(readlink -f "$f")
                rm -f "$f"
                cp "$target" "$f"
              fi
            done
          fi

      - name: 安装 Rust 工具链与 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      # 版本取自 package.json 的 packageManager，不另写死
      - uses: pnpm/action-setup@v6

      - name: 构建前端
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 构建 debug APK
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -uo pipefail
          echo "--- 环境速览 ---"
          java -version 2>&1 | head -2 || true
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          echo "NDK_HOME=$NDK_HOME"
          ls "$SDK/ndk" 2>/dev/null || true
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          echo "--- 开始构建 ---"
          npx --yes @tauri-apps/cli@2.12.0 android build --debug --target aarch64 -vv 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 本仓库的日志无法匿名下载，于是把尾部塞进 annotation——annotations API 是公开可读的
            echo "::error::构建失败（退出码 $code），日志尾部：$(tail -c 6000 build.log | tr '\n' '|')"
            exit "$code"
          fi

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: decem-chat-android-debug
          path: artifacts/*
          if-no-files-found: error
